[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhwpxlib"
version = "0.3.4"
description = "Python library for creating, editing, and previewing HWPX (Hancom Office) documents without Hancom Office"
readme = "README.md"
license = "BUSL-1.1 AND Apache-2.0"
requires-python = ">=3.8"
keywords = ["hwpx", "hwp", "hancom", "korean", "document", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Office Suites",
    "Natural Language :: Korean",
]
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=9.0"]
lxml = ["lxml>=4.9"]
hwp = ["olefile>=0.46"]
# preview now includes fonttools so Korean text embeds correctly by default.
# preview-fonts adds Pillow for more accurate text measurement (optional).
preview = ["wasmtime>=25.0", "fonttools>=4.50"]
preview-fonts = ["wasmtime>=25.0", "fonttools>=4.50", "Pillow>=9.0"]
all = [
    "Pillow>=9.0",
    "lxml>=4.9",
    "olefile>=0.46",
    "wasmtime>=25.0",
    "fonttools>=4.50",
]

[project.scripts]
pyhwpxlib = "pyhwpxlib.cli:main"

[project.urls]
Homepage = "https://github.com/ratiertm/pyhwpxlib"
Repository = "https://github.com/ratiertm/pyhwpxlib"
Issues = "https://github.com/ratiertm/pyhwpxlib/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyhwpxlib*"]

[tool.setuptools.package-data]
pyhwpxlib = [
    "tools/*.hwpx",
    "tools/*.xml",
    "vendor/*.wasm",
    "vendor/LICENSE*",
    "vendor/NOTICE*",
]
